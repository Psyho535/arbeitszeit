<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arbeitszeit – Handy und Code</title>
  </head>
  <body>
    <div class="show">
      <section class="phone-col" aria-label="App im Handy">
        <div class="phone">
          <span class="hw action" aria-hidden="true"></span>
          <span class="hw vol-up" aria-hidden="true"></span>
          <span class="hw vol-down" aria-hidden="true"></span>
          <span class="hw power" aria-hidden="true"></span>
          <div class="screen">
            <div class="statusbar" aria-hidden="true">
              <span class="sb-time" id="sb-time">9:41</span>
              <span class="island"></span>
              <span class="sb-icons">
                <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
                <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.3A10.6 10.6 0 0 0 8 .4 10.6 10.6 0 0 0 .5 3.4l1.3 1.3A8.8 8.8 0 0 1 8 2.2Zm0 3.6c1.4 0 2.7.5 3.7 1.5L13 6a7 7 0 0 0-10 0l1.3 1.3c1-1 2.3-1.5 3.7-1.5Zm0 3.5c.5 0 1 .2 1.3.6L8 11.2 6.7 9.9c.3-.4.8-.6 1.3-.6Z"/></svg>
                <svg viewBox="0 0 27 12" width="27" height="12"><rect x=".5" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2"/><path d="M25 4v4c.8-.3 1.3-1.1 1.3-2S25.8 4.3 25 4Z" opacity=".5"/></svg>
              </span>
            </div>
            <iframe id="app" src="./" title="Arbeitszeit-App"></iframe>
            <div class="homebar" aria-hidden="true"><span></span></div>
          </div>
        </div>
        <button type="button" class="reload" id="reload">App neu laden</button>
      </section>
      <section class="code-col" aria-label="Quellcode">
        <div class="tabs" role="tablist" id="tabs"></div>
        <pre class="code" id="code" tabindex="0"><code></code></pre>
      </section>
    </div>
    <script type="module" src="/src/showcase.ts"></script>
  </body>
</html>
